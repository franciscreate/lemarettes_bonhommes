  if(o.cheek){const a=warp(f.cc[0],f.cc[1]);ctx.save();ctx.translate(px*.8+a[0]-f.cc[0],py*.8+a[1]-f.cc[1]);ctx.fill(o.cheek);ctx.restore()}
  const bl=o.bl>=0?env(o.bl,.17):0,be=env(o.br,.9);
  o.brows.forEach((b,i)=>{const c=f.bc[i],sel=(o.brS===0||o.brS===i+1)?be:0,up=1.1*sel*a;ctx.save();ctx.translate(px+c[0],py-up+.5*a*S(.5*t+p[10+i])+.4*bl*a+c[1]);
    ctx.rotate((1.5*A*S(.4*t+p[12+i])-1.5*sel*A*(i?1:-1))*Math.PI/180);ctx.translate(-c[0],-c[1]);ctx.fill(b);ctx.restore()});
  for(const e of o.eyes){ctx.save();ctx.translate(px*1.15,py*1.15);ctx.translate(0,e.y);ctx.scale(1,1-.86*bl*A);ctx.translate(0,-e.y);
    ctx.fillStyle=WHITE;ctx.fill(e.hull);ctx.clip(e.hull);ctx.fillStyle="#000";ctx.beginPath();
    const u=e.u;ctx.ellipse(u[0]+o.gx*2.1*K+.12*a*S(9*t+p[2]),u[1]+o.gy*1.6*K+.1*a*S(7*t+p[3]),u[2],u[3],u[4]*Math.PI/180,0,6.2832);ctx.fill();ctx.restore()}
  ctx.restore()}
let t0=performance.now(),last=0,paused=false,tp=0,vis=true;
if("IntersectionObserver"in window)new IntersectionObserver(e=>{vis=e[0].isIntersecting}).observe(cv);
function frame(now){requestAnimationFrame(frame);if(paused||!vis)return;const t=(now-t0)/1e3,dt=Math.min(.05,t-last);last=t;
  const s=cv.width/VW;ctx.setTransform(s,0,0,s,-VX*s,-VY*s);ctx.fillStyle="#000";ctx.fillRect(VX,VY,VW,VW);
  for(const o of F){if(AMP)step(o,t,dt);draw(o,REST?0:t)}}
requestAnimationFrame(frame);
function toggle(){if(paused){t0=performance.now()-tp*1e3;paused=false}else{tp=last;paused=true}}
cv.addEventListener("dblclick",toggle);addEventListener("keydown",e=>{if(e.code==="Space"){e.preventDefault();toggle()}});
</script>
